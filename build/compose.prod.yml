services:
  flask:
    build:
      context: ..
      dockerfile: build/backend/prod.Dockerfile
    networks:
      nginx_hh:
        ipv4_address: 10.5.0.5

  worker:
    build:
      context: ..
      dockerfile: build/backend/prod.Dockerfile
    networks:
      nginx_hh:
        ipv4_address: 10.5.0.6
  db:
    networks:
      nginx_hh:
        ipv4_address: 10.5.0.7

  redis:
    networks:
      nginx_hh:
        ipv4_address: 10.5.0.8

networks:
  nginx_hh:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
          gateway: 10.5.0.1