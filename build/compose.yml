name: hh

services:
  flask:
    build:
      context: ..
      dockerfile: build/backend/Dockerfile
    depends_on:
      - db
      - redis
    env_file: .env.production
    environment:
      - DB_HOST=db        # На всякий случай, если внутри прописано по-другому
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  db:
    image: postgres:15
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data


  worker:
    build:
      context: ..
      dockerfile: build/Dockerfile
    depends_on:
      - redis
    command: rq worker --url redis://redis:6379

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: